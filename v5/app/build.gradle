plugins { id 'com.android.application' }

android {
    namespace 'com.acrps.podcastforge'
    compileSdk 36

    defaultConfig {
        applicationId 'com.acrps.podcastforge'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '5.0.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'com.github.rizukirr.audx-android:audx-core:v2.1.2'
    implementation 'com.github.rizukirr.audx-android:audx-arm64-v8a:v2.1.2'
}
