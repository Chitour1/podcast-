name: Precise Final APK
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and validate corrected APK
        shell: bash
        run: bash tools/run_precise_ci.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Fi-Zilal-Precise-Corrected
          path: |
            Fi-Zilal-Precise-Corrected.apk
            validation.txt
          if-no-files-found: error
