name: Build Voice Training APK

on:
  push:
    branches: [ voice-booking-training ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore and update Android project
        run: |
          rm -rf trainingapp /tmp/voxaride
          cat payload/voxaride.part?? | base64 -d > /tmp/voxaride.zip
          unzip -q /tmp/voxaride.zip -d /tmp/voxaride
          mv /tmp/voxaride/VoxaRideTraining trainingapp
          cat payload/mainv2.part00 | base64 -d | gzip -d > trainingapp/app/src/main/java/com/acrps/voxaride/MainActivity.java
          sed -i "s/versionCode 1/versionCode 2/; s/versionName '1.0.0'/versionName '2.0.0'/" trainingapp/app/build.gradle
      - name: Build debug APK
        working-directory: trainingapp
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoxaRide-V2-APK
          path: trainingapp/app/build/outputs/apk/debug/app-debug.apk
