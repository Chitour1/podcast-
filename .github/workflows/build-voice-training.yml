name: Build Voice Training APK

on:
  push:
    branches: [ voice-booking-training ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create Android project
        run: |
          rm -rf trainingapp
          mkdir -p trainingapp/app/src/main/java/com/acrps/voxaride trainingapp/app/src/main/res/values trainingapp/app/src/main/res/drawable
          cat overlay/MainActivity.part?? > trainingapp/app/src/main/java/com/acrps/voxaride/MainActivity.java
          cat > trainingapp/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'VoxaRide'
          include ':app'
          EOF
          cat > trainingapp/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > trainingapp/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > trainingapp/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.acrps.voxaride'
            compileSdk 35
            defaultConfig { applicationId 'com.acrps.voxaride'; minSdk 26; targetSdk 35; versionCode 2; versionName '2.0.0' }
          }
          EOF
          cat > trainingapp/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <application android:allowBackup="false" android:label="VoxaRide" android:theme="@style/AppTheme" android:icon="@drawable/app_icon" android:supportsRtl="true">
              <activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > trainingapp/app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">#F59E0B</item><item name="android:navigationBarColor">#121A2B</item><item name="android:statusBarColor">#121A2B</item></style></resources>
          EOF
          cat > trainingapp/app/src/main/res/drawable/app_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#121A2B" android:pathData="M0,0h108v108h-108z"/><path android:fillColor="#F59E0B" android:pathData="M23,28h62a8,8 0,0 1,8 8v36a8,8 0,0 1,-8 8h-62a8,8 0,0 1,-8 -8v-36a8,8 0,0 1,8 -8z"/><path android:fillColor="#FFFFFF" android:pathData="M31,42h46l-8,24h-30z"/></vector>
          EOF
      - name: Build debug APK
        working-directory: trainingapp
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoxaRide-V2-APK
          path: trainingapp/app/build/outputs/apk/debug/app-debug.apk
