name: Build PodcastForge Studio 9

on:
  pull_request:
    branches: [main]
    paths:
      - 'pf9s9.p0000'
      - 'pf9s9.p0001'
      - 'pf9s9.p0002'
      - 'pf9s9.p0003'
      - 'pf9s9.p0004'
      - 'pf9s9.p0005'
      - 'pf9s9.part01'
      - 'pf9s9.part02'
      - '.github/workflows/build-podcastforge9.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified Studio 9 source
        shell: bash
        run: |
          set -euo pipefail
          echo 'cab5c3b5835c52567735133355ace84cb06720746bfaf0504c57305722a64a3a  pf9s9.p0000' | sha256sum -c -
          echo 'e8bb77a0cb632b2e487c56fa9c55c674127689578a9925918d96245d7637b023  pf9s9.p0001' | sha256sum -c -
          echo '992fc4fdb840032418a10852533c12fc56eb4e3cbee7cce7ec8d84068a5b5237  pf9s9.p0002' | sha256sum -c -
          echo '14872c7d428789de7d7faac308521be345f0670e3f2f22033f7480f107a16332  pf9s9.p0003' | sha256sum -c -
          echo '55e796e040e2613b9a40ee673b9017d8849c4b9b452c77ff5ec05b562d8df566  pf9s9.p0004' | sha256sum -c -
          echo '3b9bd3520a21b25ee0bd3b0a2d4eadf88fbd43318cb1e5da3fa2d27e591c0315  pf9s9.p0005' | sha256sum -c -
          echo 'd996cc3077c3a8765197ffc77a05b76e2a1c520e69e8dd78bf44510c337e40a0  pf9s9.part01' | sha256sum -c -
          echo 'ed549c031d828d68f8243462da98d22786b3ef466ab75cdddb8441e92e560980  pf9s9.part02' | sha256sum -c -
          cat pf9s9.p0000 pf9s9.p0001 pf9s9.p0002 pf9s9.p0003 pf9s9.p0004 pf9s9.p0005 pf9s9.part01 pf9s9.part02 > pf9studio9.b64
          test "$(wc -c < pf9studio9.b64)" -eq 26980
          base64 -d pf9studio9.b64 > pf9studio9.zip
          echo 'e08e2b1bf19500bcd739ded690fd7b67296e5b424e4e3d10c24c1189d4a73342  pf9studio9.zip' | sha256sum -c -
          unzip -tq pf9studio9.zip
          unzip -q pf9studio9.zip
          test -f PodcastForgeStudio9/settings.gradle
          test -f PodcastForgeStudio9/app/src/main/java/com/acrps/podcastforge9/NeuralPodcastEngine.java
          grep -q 'restoreStudioTone' PodcastForgeStudio9/app/src/main/java/com/acrps/podcastforge9/NeuralPodcastEngine.java
          grep -q 'ToneProfile' PodcastForgeStudio9/app/src/main/java/com/acrps/podcastforge9/NeuralPodcastEngine.java
          grep -q 'WavSink24' PodcastForgeStudio9/app/src/main/java/com/acrps/podcastforge9/NeuralPodcastEngine.java
          grep -q "versionName '9.0.0'" PodcastForgeStudio9/app/build.gradle
          grep -q "applicationId 'com.acrps.podcastforge9'" PodcastForgeStudio9/app/build.gradle
          ! grep -R 'com.acrps.podcastforge8\|Studio 8\|STUDIO 8' PodcastForgeStudio9/app/src/main PodcastForgeStudio9/app/build.gradle

      - name: Download official Sherpa ONNX runtime and DPDFNet2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p PodcastForgeStudio9/app/libs PodcastForgeStudio9/app/src/main/assets
          curl --retry 4 --retry-delay 2 -fL \
            'https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.2/sherpa-onnx-1.13.2.aar' \
            -o PodcastForgeStudio9/app/libs/sherpa-onnx.aar
          model='PodcastForgeStudio9/app/src/main/assets/dpdfnet2_48khz_hr.onnx'
          ok=0
          for url in \
            'https://github.com/k2-fsa/sherpa-onnx/releases/download/speech-enhancement-models/dpdfnet2_48khz_hr.onnx' \
            'https://github.com/k2-fsa/sherpa-onnx/releases/download/speech-enhancement-models/dpdfnet8_48khz_hr.onnx'
          do
            if curl --retry 3 --retry-delay 2 -fL "$url" -o "$model"; then ok=1; break; fi
          done
          test "$ok" -eq 1
          test -s "$model"
          unzip -tq PodcastForgeStudio9/app/libs/sherpa-onnx.aar

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Studio 9 APK
        working-directory: PodcastForgeStudio9
        run: gradle --no-daemon clean assembleDebug

      - name: Verify package, neural engine, restoration pipeline, and storage
        shell: bash
        run: |
          set -euo pipefail
          apk='PodcastForgeStudio9/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          unzip -tq "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | tee /tmp/badging.txt
          grep -q "package: name='com.acrps.podcastforge9' versionCode='10' versionName='9.0.0'" /tmp/badging.txt
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libsherpa-onnx-jni.so'
          unzip -l "$apk" | grep -q 'assets/dpdfnet2_48khz_hr.onnx'
          grep -R -q 'Podcasts/PodcastForge/' PodcastForgeStudio9/app/src/main/java/com/acrps/podcastforge9/ProcessingService.java
          grep -R -q 'Music/PodcastForge/' PodcastForgeStudio9/app/src/main/java/com/acrps/podcastforge9/ProcessingService.java
          grep -R -q 'ترميم حضور الميكروفون' PodcastForgeStudio9/app/src/main/java/com/acrps/podcastforge9/NeuralPodcastEngine.java
          grep -R -q 'Wav.writeHeader(out,d.samples,d.sampleRate,1,24)' PodcastForgeStudio9/app/src/main/java/com/acrps/podcastforge9/NeuralPodcastEngine.java
          rm -f /tmp/all.dex
          while IFS= read -r dex; do unzip -p "$apk" "$dex" >> /tmp/all.dex; done < <(zipinfo -1 "$apk" | grep -E '^classes[0-9]*\.dex$')
          strings /tmp/all.dex > /tmp/dex-strings.txt
          grep -Fq 'Lkotlin/jvm/internal/Intrinsics;' /tmp/dex-strings.txt
          grep -Fq 'Lcom/k2fsa/sherpa/onnx/OnlineSpeechDenoiser;' /tmp/dex-strings.txt
          grep -Fq 'Lcom/acrps/podcastforge9/NeuralPodcastEngine;' /tmp/dex-strings.txt
          cp "$apk" PodcastForge-Studio-9.apk
          sha256sum PodcastForge-Studio-9.apk | tee PodcastForge-Studio-9.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PodcastForge-Studio-9-APK
          path: |
            PodcastForge-Studio-9.apk
            PodcastForge-Studio-9.sha256
          if-no-files-found: error
