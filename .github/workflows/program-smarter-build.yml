name: Program Smarter Android Build

on:
  push:
    branches: [program-smarter-app]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install compatible Expo packages
        working-directory: program-smarter-ci
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps
          npx expo install expo-sqlite expo-status-bar react-native-safe-area-context
          npm install --legacy-peer-deps

      - name: Prebuild Android
        working-directory: program-smarter-ci
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build APK
        working-directory: program-smarter-ci/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: program-smarter-apk
          path: program-smarter-ci/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
