name: Program Smarter Android Standalone Build

on:
  push:
    branches: [program-smarter-app]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install compatible Expo packages
        working-directory: program-smarter-ci
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps
          npx expo install expo-sqlite expo-status-bar react-native-safe-area-context
          npm install --legacy-peer-deps

      - name: Fix and validate premium UI bundle
        working-directory: program-smarter-ci
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('App.tsx')
          s=p.read_text()
          old="catch{Alert.alert('Program','Build a routine first.')}}/>"
          new="catch{Alert.alert('Program','Build a routine first.')}}}/>"
          if old not in s:
              raise SystemExit('expected AppInner fragment not found')
          p.write_text(s.replace(old,new,1))
          PY
          npx expo export --platform android --output-dir /tmp/program-smarter-export

      - name: Prebuild Android
        working-directory: program-smarter-ci
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone release APK
        working-directory: program-smarter-ci/android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: program-smarter-premium-apk
          path: program-smarter-ci/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
