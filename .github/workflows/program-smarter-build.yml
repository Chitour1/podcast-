name: Program Smarter Android Standalone Build

on:
  push:
    branches: [program-smarter-app]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Expo dependencies
        working-directory: program-smarter-ci
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps
          npx expo install expo-sqlite expo-status-bar react-native-safe-area-context expo-linear-gradient expo-haptics expo-document-picker expo-file-system expo-sharing react-native-svg
          npm install buffer --legacy-peer-deps
      - name: Domain tests
        working-directory: program-smarter-ci
        run: npm run test:domain
      - name: Validate Metro bundle
        working-directory: program-smarter-ci
        run: npx expo export --platform android --output-dir /tmp/program-smarter-export
      - name: Prebuild Android
        working-directory: program-smarter-ci
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build standalone release APK
        working-directory: program-smarter-ci/android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: program-smarter-v04-apk
          path: program-smarter-ci/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
