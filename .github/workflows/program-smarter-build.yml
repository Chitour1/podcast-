name: Program Smarter Android Build

on:
  push:
    branches: [program-smarter-app]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source archive
        shell: bash
        run: |
          set -euo pipefail
          cat program-smarter-build/part*.b64 | base64 -d > /tmp/program-smarter.zip
          unzip -q /tmp/program-smarter.zip -d /tmp/program-smarter-src
          test -f /tmp/program-smarter-src/program-smarter/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Expo and compatible native packages
        working-directory: /tmp/program-smarter-src/program-smarter
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json','utf8'));
          p.dependencies = {
            expo: '~57.0.14',
            react: '19.2.3',
            'react-native': '0.86.2',
            '@supabase/supabase-js': '^2.110.3',
            'react-native-purchases': '^10.9.0',
            'react-native-url-polyfill': '^3.0.0'
          };
          fs.writeFileSync('package.json', JSON.stringify(p,null,2));
          NODE
          rm -f package-lock.json
          npm install --legacy-peer-deps
          npx expo install expo-router expo-document-picker expo-file-system expo-haptics expo-localization expo-notifications expo-secure-store expo-sqlite expo-status-bar expo-sharing react-native-safe-area-context react-native-screens
          npm install --legacy-peer-deps

      - name: Run domain tests
        working-directory: /tmp/program-smarter-src/program-smarter
        run: npm test

      - name: Prebuild Android
        working-directory: /tmp/program-smarter-src/program-smarter
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build APK
        working-directory: /tmp/program-smarter-src/program-smarter/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: program-smarter-apk
          path: /tmp/program-smarter-src/program-smarter/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
