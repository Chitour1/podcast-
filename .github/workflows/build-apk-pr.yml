name: Verify PodcastForge Neural Studio 7
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore independent Neural Studio 7 source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://raw.githubusercontent.com/Chitour1/podcast-/podcastforge-neural-v7-clean/pf7clean.b64' -o pf7clean.b64
          base64 -d pf7clean.b64 > pf7clean.zip
          unzip -q pf7clean.zip
          test -f pf7clean/settings.gradle
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pf7clean/app/src/main/java/com/acrps/podcastforge7/NeuralPodcastEngine.java')
          s=p.read_text()
          old='''OfflineSpeechDenoiserDpdfNetModelConfig mc=OfflineSpeechDenoiserDpdfNetModelConfig.builder().setModel(model.getAbsolutePath()).build();
                  OfflineSpeechDenoiserModelConfig om=OfflineSpeechDenoiserModelConfig.builder().setDpdfnet(mc).setNumThreads(Math.max(2,Runtime.getRuntime().availableProcessors()/2)).setDebug(false).setProvider("cpu").build();
                  OnlineSpeechDenoiser den=new OnlineSpeechDenoiser(OnlineSpeechDenoiserConfig.builder().setModel(om).build());'''
          new='''OfflineSpeechDenoiserGtcrnModelConfig gtcrn=new OfflineSpeechDenoiserGtcrnModelConfig("");
                  OfflineSpeechDenoiserDpdfNetModelConfig mc=new OfflineSpeechDenoiserDpdfNetModelConfig(model.getAbsolutePath());
                  OfflineSpeechDenoiserModelConfig om=new OfflineSpeechDenoiserModelConfig(gtcrn,mc,Math.max(2,Runtime.getRuntime().availableProcessors()/2),false,"cpu");
                  OnlineSpeechDenoiserConfig config=new OnlineSpeechDenoiserConfig(om);
                  OnlineSpeechDenoiser den=new OnlineSpeechDenoiser(null,config);'''
          if old not in s: raise SystemExit('Expected API block not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Download official Sherpa ONNX runtime and DPDFNet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pf7clean/app/libs pf7clean/app/src/main/assets
          curl --retry 3 --retry-delay 2 -fL 'https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.2/sherpa-onnx-1.13.2.aar' -o pf7clean/app/libs/sherpa-onnx.aar
          model='pf7clean/app/src/main/assets/dpdfnet8_48khz_hr.onnx'
          ok=0
          for url in \
            'https://github.com/k2-fsa/sherpa-onnx/releases/download/speech-enhancement-models/dpdfnet8_48khz_hr.onnx' \
            'https://github.com/k2-fsa/sherpa-onnx/releases/download/speech-enhancement-models/dpdfnet2_48khz_hr.onnx' \
            'https://github.com/k2-fsa/sherpa-onnx/releases/download/speech-enhancement-models/dpdfnet_baseline.onnx'
          do
            if curl --retry 2 --retry-delay 2 -fL "$url" -o "$model"; then ok=1; break; fi
          done
          test "$ok" -eq 1
          test -s "$model"
          unzip -tq pf7clean/app/libs/sherpa-onnx.aar
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build independent Neural Studio 7 APK
        working-directory: pf7clean
        run: gradle --no-daemon assembleDebug
      - name: Verify neural runtime and model are packaged
        shell: bash
        run: |
          set -euo pipefail
          apk='pf7clean/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libsherpa-onnx-jni.so'
          unzip -l "$apk" | grep -q 'assets/dpdfnet8_48khz_hr.onnx'
          sha256sum "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: PodcastForge-Neural-Studio-7-APK
          path: pf7clean/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
