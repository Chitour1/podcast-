name: Verify PodcastForge APK
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore PodcastForge Studio 6
        shell: bash
        run: |
          cat studio6.part00.b64 studio6.part01.b64 studio6.part02.b64 studio6.part03.b64 studio6.part04.b64 | base64 -d > studio6.zip
          unzip -q studio6.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Studio 6 debug APK
        working-directory: pf6
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PodcastForge-Studio-6-APK
          path: pf6/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
