name: Verify PodcastForge APK
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore project
        shell: bash
        run: |
          cat project.part00.b64 project.part01.b64 | base64 -d > project.zip
          unzip -q project.zip
          cp -rf v3/app/* PodcastForge/app/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: PodcastForge
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PodcastForge-v3-APK
          path: PodcastForge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
