name: Build View Source Ultra APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore source archive
        run: |
          cat .ci/viewsource.part0 .ci/viewsource.part1 | base64 -d > ViewSourceUltra-source.zip
          unzip -q ViewSourceUltra-source.zip

      - name: Build debug APK
        working-directory: ViewSourceUltra
        run: gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        run: cp ViewSourceUltra/app/build/outputs/apk/debug/app-debug.apk ViewSourceUltra-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ViewSourceUltra-APK
          path: ViewSourceUltra-debug.apk
          if-no-files-found: error
