name: Build Fi Zilal Complete APK
on:
  push:
    branches: [main, fi-zilal-complete-rebuild]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare complete offline source and data
        shell: bash
        run: |
          set -euo pipefail
          cat tools/final_rebuild/part00 tools/final_rebuild/part01 tools/final_rebuild/rest00 tools/final_rebuild/rest01 tools/final_rebuild/rest02 tools/final_rebuild/rest03 tools/final_rebuild/rest04 tools/final_rebuild/rest05 tools/final_rebuild/rest06 tools/final_rebuild/rest07 tools/final_rebuild/rest08 > build_fizilal_final.py.gz.b64
          test $(wc -c < build_fizilal_final.py.gz.b64) -eq 51804
          base64 -d build_fizilal_final.py.gz.b64 | gzip -d > build_fizilal_final.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build_fizilal_final.py')
          s = p.read_text(encoding='utf-8')
          old_match = "if t == canon or t.startswith('سوره ' + canon):"
          new_match = "if t == canon or t.startswith('سوره ' + canon) or t.startswith(canon + ' ') or (len(t) < 90 and canon in t):"
          if old_match not in s:
              raise SystemExit('HEADING_PATCH_TARGET_NOT_FOUND')
          s = s.replace(old_match, new_match)
          old = """    if found is None:\n        raise SystemExit('MISSING_SURAH=%d:%s;FOUND=%d' % (idx, name, len(starts)))\n    starts.append(found)\n    pos = found + 1\n"""
          new = """    if found is None and idx == 1:\n        found = -1\n    if found is None:\n        raise SystemExit('MISSING_SURAH=%d:%s;FOUND=%d' % (idx, name, len(starts)))\n    starts.append(found)\n    pos = max(0, found + 1)\n"""
          if old not in s:
              raise SystemExit('PARSER_PATCH_TARGET_NOT_FOUND')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          python3 -m py_compile build_fizilal_final.py
          BOOK_URL='https://islamport.com/kindle/%D8%A7%D9%84%D9%85%D9%83%D8%AA%D8%A8%D8%A9%20%D8%A7%D9%84%D8%B4%D8%A7%D9%85%D9%84%D8%A9%20%D9%84%D9%84%D9%83%D9%86%D8%AF%D9%84/%D8%A7%D9%84%D8%AA%D9%81%D8%A7%D8%B3%D9%8A%D8%B1/%D9%81%D9%8A%20%D8%B8%D9%84%D8%A7%D9%84%20%D8%A7%D9%84%D9%82%D8%B1%D8%A2%D9%86/%D9%81%D9%8A%20%D8%B8%D9%84%D8%A7%D9%84%20%D8%A7%D9%84%D9%82%D8%B1%D8%A2%D9%86%20%D9%84%D9%80%20%D8%B3%D9%8A%D8%AF%20%D9%82%D8%B7%D8%A8.docx'
          curl -L --fail --retry 4 -A 'Mozilla/5.0' "$BOOK_URL" -o book.docx
          curl -L --fail --retry 4 -A 'FiZilalAndroid/10.0' 'https://api.alquran.cloud/v1/quran/quran-uthmani' -o quran.json
          curl -L --fail --retry 4 -A 'FiZilalAndroid/10.0' 'https://api.alquran.cloud/v1/quran/quran-simple-clean' -o comparison.json
          test $(stat -c%s book.docx) -gt 5000000
          test $(stat -c%s quran.json) -gt 1000000
          BOOK_DOCX=book.docx QURAN_JSON=quran.json COMPARE_JSON=comparison.json python3 build_fizilal_final.py | tee validation.txt
          grep -q 'VALIDATED_SURAH_COUNT=114' validation.txt
          grep -q 'VALIDATED_AYAH_COUNT=6236' validation.txt
          grep -q 'PROJECT_SOURCES_WRITTEN=complete' validation.txt
          grep -q 'FINAL_SCOPE_OVERRIDES_WRITTEN=1' validation.txt
          ! grep -R 'TextToSpeech\|sync_uri' app/src/main/java
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'assets/fizilal_pro.db'
          test $(stat -c%s "$APK") -gt 2000000
          echo "APK_BYTES=$(stat -c%s "$APK")" | tee -a validation.txt
          sha256sum "$APK" | tee -a validation.txt
          cp "$APK" Fi-Zilal-Complete-Final.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Fi-Zilal-Complete-Final
          path: |
            Fi-Zilal-Complete-Final.apk
            validation.txt
          if-no-files-found: error
