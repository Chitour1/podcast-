name: Build WebCapture Ultra APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore and patch source
        run: |
          unzip -q .ci/WebCaptureUltra-source.zip -d /tmp/webcapture
          test -f /tmp/webcapture/WebCaptureUltra/settings.gradle
          cat .ci/MainActivity.partA .ci/MainActivity.partB > /tmp/webcapture/WebCaptureUltra/app/src/main/java/com/webcapture/ultra/MainActivity.java
          cp .ci/JpegPdfWriter.java /tmp/webcapture/WebCaptureUltra/app/src/main/java/com/webcapture/ultra/JpegPdfWriter.java
          cp .ci/activity_main.xml /tmp/webcapture/WebCaptureUltra/app/src/main/res/layout/activity_main.xml
          sed -i 's/versionCode [0-9][0-9]*/versionCode 3/; s/versionName "[^"]*"/versionName "1.1.1"/' /tmp/webcapture/WebCaptureUltra/app/build.gradle

      - name: Build debug APK
        run: gradle -p /tmp/webcapture/WebCaptureUltra --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        run: |
          mkdir -p /tmp/artifact
          cp /tmp/webcapture/WebCaptureUltra/app/build/outputs/apk/debug/app-debug.apk /tmp/artifact/WebCaptureUltra-v1.1.1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WebCaptureUltra-APK
          path: /tmp/artifact/WebCaptureUltra-v1.1.1-debug.apk
          if-no-files-found: error
          retention-days: 7
