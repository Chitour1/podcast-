name: Build WebCapture Ultra APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.ci/webcapture.part0'
      - '.ci/webcapture.part1'
      - '.github/workflows/build-webcapture-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore source archive
        run: |
          cat .ci/webcapture.part0 .ci/webcapture.part1 | base64 -d > /tmp/WebCaptureUltra-source.zip
          unzip -q /tmp/WebCaptureUltra-source.zip -d /tmp/webcapture
          test -f /tmp/webcapture/WebCaptureUltra/settings.gradle

      - name: Upload restored source
        uses: actions/upload-artifact@v4
        with:
          name: WebCaptureUltra-Source
          path: /tmp/WebCaptureUltra-source.zip
          if-no-files-found: error
          retention-days: 1

      - name: Build debug APK
        run: gradle -p /tmp/webcapture/WebCaptureUltra --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        run: |
          mkdir -p /tmp/artifact
          cp /tmp/webcapture/WebCaptureUltra/app/build/outputs/apk/debug/app-debug.apk /tmp/artifact/WebCaptureUltra-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WebCaptureUltra-APK
          path: /tmp/artifact/WebCaptureUltra-debug.apk
          if-no-files-found: error
          retention-days: 7
