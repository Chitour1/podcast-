name: Build PodcastForge APK
on:
  push:
    branches: [podcastforge-apk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Restore project
        shell: bash
        run: |
          echo '' | base64 -d > project.zip
          unzip -q project.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: PodcastForge
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PodcastForge-APK
          path: PodcastForge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
