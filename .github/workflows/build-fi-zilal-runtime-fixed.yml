name: Build Fi Zilal Runtime Fixed APK
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and validate runtime-fixed APK
        run: bash tools/build_runtime_fixed.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Fi-Zilal-Runtime-Fixed
          path: |
            Fi-Zilal-Runtime-Fixed.apk
            validation.txt
          if-no-files-found: error
