<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محرك بودكاست المركز العربي</title><link rel="stylesheet" href="app.css"></head><body><main class="shell"><header class="hero"><div><p class="eyebrow">ACRPS OFFLINE AUDIO ENGINE</p><h1>محرك بودكاست المركز العربي</h1><p class="subtitle">ترميم عصبي محلي ومعالجة ملفات كثيرة دون أوامر أو خادم أو اتصال بالإنترنت.</p></div><div id="engineBadge" class="badge waiting">جاري فحص المحرك…</div></header><section class="panel controls"><div class="control-row"><button id="chooseFiles" class="primary">اختيار ملفات الصوت</button><button id="chooseOutput" class="secondary">تغيير مجلد الحفظ</button><button id="openOutput" class="ghost">فتح مجلد النتائج</button></div><div class="output-line"><span>مجلد الحفظ:</span><strong id="outputPath">—</strong></div><div id="selected" class="selected empty">لم تُحدّد ملفات بعد.</div><button id="start" class="start" disabled>ابدأ المعالجة</button><p id="notice" class="notice"></p></section><section class="panel"><div class="section-head"><h2>قائمة المعالجة</h2><span id="jobCount">0 ملفات</span></div><div id="jobs" class="jobs empty">لا توجد مهام بعد.</div></section></main><script src="app.js"></script></body></html>
