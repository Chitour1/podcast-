plugins { id 'com.android.application' }

android {
    namespace 'com.websource.ultra'
    compileSdk 35
    defaultConfig {
        applicationId 'com.websource.ultra'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
